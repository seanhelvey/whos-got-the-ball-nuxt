name: Claude review

# Manual only. Reviews run locally with `/code-review <pr> --comment` in
# Claude Code, so no Claude token is stored on GitHub. To review in CI instead, add the
# CLAUDE_CODE_OAUTH_TOKEN secret and switch the trigger to pull_request.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Pinned to commit SHAs so a moved tag can't swap the code that sees the secret.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr }}

            Review this pull request by the rules in CLAUDE.md.
            Read the diff with `gh pr diff`, then post the ranked findings
            as one comment with `gh pr comment`.
          claude_args: >-
            --max-turns 5
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
